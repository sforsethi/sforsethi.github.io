<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <title>Nilfa Saha Karmakar · Niyat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      color: #17171c; background: linear-gradient(145deg, #f4f1ff, #fff5fa);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px); padding: 34px; border-radius: 28px; background: rgba(255,255,255,.88);
      box-shadow: 0 24px 70px rgba(65,45,120,.16); text-align: center;
    }
    .avatar {
      display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 22px;
      border-radius: 50%; color: white; background: linear-gradient(135deg,#4f46e5,#db2777);
      font-size: 28px; font-weight: 700;
    }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.5px; }
    p { margin: 8px 0 28px; color: #65616f; font-size: 17px; }
    a.button {
      display: block; padding: 16px 20px; border-radius: 15px; background: #4f46e5;
      color: white; text-decoration: none; font-size: 17px; font-weight: 650;
    }
    a.secondary { display: inline-block; margin-top: 20px; color: #4f46e5; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <div class="avatar">NS</div>
    <h1>Nilfa Saha Karmakar</h1>
    <p>Niyat</p>
    <a class="button" href="https://sforsethi.github.io/niyat-contact.vcf">Add to Contacts</a>
    <a class="secondary" href="https://niyatstudio.com">Visit Niyat Studio</a>
  </main>
</body>
</html>
